    Session:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
          example: 2026-11-02T06:00:00.000Z
        user_id:
          type: string
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - refresh_expires_at
        - user_id
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: cadenza_overlap
            message:
              type: string
            conflicts:
              type: array
              items:
                type: string
              description: Sorted IDs of the conflicting events
          required:
            - code
            - message
      required:
        - error
    Me:
      type: object
      properties:
        id:
          type: string
        display_name:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
          description: Set for email accounts; null for Sign in with Apple
        timezone:
          type: string
        timezone_supported:
          type: boolean
        token_balance:
          type: integer
        created_at:
          type: string
          format: date-time
          example: 2026-11-02T06:00:00.000Z
        settings:
          type: object
          properties:
            planning_prompts:
              type: array
              items:
                $ref: "#/components/schemas/PlanningPrompt"
            day_end_local_time:
              type: string
            preferences:
              type: object
              additionalProperties: {}
          required:
            - planning_prompts
            - day_end_local_time
            - preferences
      required:
        - id
        - display_name
        - email
        - timezone
        - timezone_supported
        - token_balance
        - created_at
        - settings
    PlanningPrompt:
      type: object
      properties:
        weekday:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
          minItems: 1
          description: ISO weekdays, 1 = Monday
        local_time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
      required:
        - weekday
        - local_time
    EventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
    Event:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        notes:
          type:
            - string
            - "null"
        goal_id:
          type:
            - string
            - "null"
        breakdown_item_id:
          type:
            - string
            - "null"
        planned_start:
          type: string
          format: date-time
          example: 2026-11-02T06:00:00.000Z
        planned_end:
          type: string
          format: date-time
          example: 2026-11-02T06:00:00.000Z
        kind:
          $ref: "#/components/schemas/EventKind"
        duration_bars:
          type: integer
        status:
          $ref: "#/components/schemas/EventStatus"
        version:
          type: integer
        record:
          $ref: "#/components/schemas/EventRecord"
        created_at:
          type: string
          format: date-time
          example: 2026-11-02T06:00:00.000Z
        updated_at:
          type: string
          format: date-time
          example: 2026-11-02T06:00:00.000Z
      required:
        - id
        - title
        - notes
        - goal_id
        - breakdown_item_id
        - planned_start
        - planned_end
        - kind
        - duration_bars
        - status
        - version
        - record
        - created_at
        - updated_at
    EventKind:
      type: string
      enum:
        - cadenza
        - tutti
      description: "cadenza: timed, rewarded focus work that never overlaps another
        Cadenza. tutti: an ordinary event that overlaps freely."
    EventStatus:
      type: string
      enum:
        - planned
        - in_progress
        - done
        - missed
