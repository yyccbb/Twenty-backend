# Generated by `npm run openapi` from the Zod route schemas. Do not edit by hand.
openapi: 3.1.0
info:
  title: Twenty API
  version: 1.0.0
  description: 'Backend for Twenty. Times are ISO 8601 instants; all grid math
    uses 20-minute bars. Errors use { "error": { "code", "message" } }.'
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
