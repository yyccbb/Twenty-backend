paths:
  /healthz:
    get:
      tags:
        - Ops
      summary: Liveness check
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /v1/auth/apple:
    post:
      tags:
        - Auth
      summary: Exchange a Sign in with Apple ID token for access and refresh tokens
      description: Creates the user on first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  minLength: 1
                nonce:
                  type:
                    - string
                    - "null"
                  description: The raw nonce whose SHA-256 was sent to Apple
                display_name:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                timezone:
                  type: string
                  example: Asia/Shanghai
                device_label:
                  type:
                    - string
                    - "null"
                  maxLength: 100
              required:
                - id_token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The request breaks a rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate a refresh token
      description: The old refresh token stops working. Reusing a rotated token
        revokes every session of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 1
              required:
                - refresh_token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 1
              required:
                - refresh_token
      responses:
        "204":
          description: Revoked
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me:
    get:
      tags:
        - Account
      summary: Profile, time zone, settings and token balance
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Account
      summary: Delete the account and its personal data
      description: Required by App Store rules. All sessions are revoked.
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            description: Retries with the same key replay the first response instead of
              repeating the write
          required: false
          description: Retries with the same key replay the first response instead of
            repeating the write
          name: idempotency-key
          in: header
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me/settings:
    patch:
      tags:
        - Account
      summary: Update time zone, planning-prompt schedule, day end and preferences
      description: Time zones that are not a whole number of hours from UTC are
        rejected with 422 unsupported_timezone.
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            description: Retries with the same key replay the first response instead of
              repeating the write
          required: false
          description: Retries with the same key replay the first response instead of
            repeating the write
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                timezone:
                  type: string
                planning_prompts:
                  type: array
                  items:
                    $ref: "#/components/schemas/PlanningPrompt"
                  maxItems: 50
                day_end_local_time:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  example: 00:00
                  description: Local wall-clock time, HH:MM
                preferences:
                  type: object
                  additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The request breaks a rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/events:
    get:
      tags:
        - Calendar
      summary: Events whose planned block intersects [from, to)
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
          required: false
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          required: false
          name: limit
          in: query
        - schema:
            type: string
            format: date-time
            example: 2026-11-02T14:00:00+08:00
          required: true
          name: from
          in: query
        - schema:
            type: string
            format: date-time
            example: 2026-11-02T14:00:00+08:00
          required: true
          name: to
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Calendar
      summary: Create an event
      description: planned_start must be on a :00/:20/:40 mark (422 slot_misaligned)
        and duration_slots a whole number ≥ 1 (422 invalid_duration). At most 2
        events may overlap (409 overlap_limit).
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            description: Retries with the same key replay the first response instead of
              repeating the write
          required: false
          description: Retries with the same key replay the first response instead of
            repeating the write
          name: idempotency-key
          in: header
      requestBody:
        required: true
