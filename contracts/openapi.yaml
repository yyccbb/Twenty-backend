  parameters: {}
paths:
  /healthz:
    get:
      tags:
        - Ops
      summary: Liveness check
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /v1/auth/apple:
    post:
      tags:
        - Auth
      summary: Exchange a Sign in with Apple ID token for access and refresh tokens
      description: Creates the user on first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  minLength: 1
                nonce:
                  type:
                    - string
                    - "null"
                  description: The raw nonce whose SHA-256 was sent to Apple
                display_name:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                timezone:
                  type: string
                  example: Asia/Shanghai
                device_label:
                  type:
                    - string
                    - "null"
                  maxLength: 100
              required:
                - id_token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The request breaks a rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/email/signup:
    post:
      tags:
        - Auth
      summary: Create an email + password account and sign in
      description: The email is checked for format only and is not verified. Email
        accounts are separate from Apple accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
                  example: ada@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                display_name:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                timezone:
                  type: string
                  example: Asia/Shanghai
                device_label:
                  type:
                    - string
                    - "null"
                  maxLength: 100
              required:
                - email
                - password
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict with the current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The request breaks a rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/email/signin:
    post:
      tags:
        - Auth
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
                  example: ada@example.com
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                device_label:
                  type:
                    - string
                    - "null"
                  maxLength: 100
              required:
                - email
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate a refresh token
      description: The old refresh token stops working. Reusing a rotated token
        revokes every session of the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 1
              required:
                - refresh_token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  minLength: 1
              required:
                - refresh_token
      responses:
        "204":
          description: Revoked
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me:
    get:
      tags:
        - Account
      summary: Profile, time zone, settings and token balance
      security:
        - Bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Account
      summary: Delete the account and its personal data
      description: Required by App Store rules. All sessions are revoked.
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            description: Retries with the same key replay the first response instead of
              repeating the write
          required: false
          description: Retries with the same key replay the first response instead of
            repeating the write
          name: idempotency-key
          in: header
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/me/settings:
    patch:
      tags:
        - Account
      summary: Update time zone, planning-prompt schedule, day end and preferences
      description: Time zones that are not a whole number of hours from UTC are
        rejected with 422 unsupported_timezone.
      security:
        - Bearer: []
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            description: Retries with the same key replay the first response instead of
              repeating the write
          required: false
          description: Retries with the same key replay the first response instead of
            repeating the write
          name: idempotency-key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type:
                    - string
                    - "null"
                  maxLength: 100
                timezone:
